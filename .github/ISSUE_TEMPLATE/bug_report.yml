name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press the shortcut
        2. Select an area containing …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kingfisher version
      description: Output of `kingfisher --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: Ubuntu 22.04, GNOME 42, Wayland
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Run `kingfisher` from a terminal and paste any errors. Remove anything private first.
      render: text
