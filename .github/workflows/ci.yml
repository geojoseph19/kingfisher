name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil \
            tesseract-ocr tesseract-ocr-eng python3-pyzbar python3-qrcode
      - name: Lint
        run: |
          python3 -m pip install --user ruff==0.16.6
          python3 -m ruff check kingfisher bin/kingfisher tests
      - name: Check shell scripts
        run: |
          bash -n install.sh uninstall.sh packaging/build-deb.sh bin/kingfisher
          shellcheck install.sh uninstall.sh packaging/build-deb.sh
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -t . -v

  snap:
    name: Build snap
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          # The recipe also cross-builds arm64; CI installs and checks amd64.
          snapcraft-args: --platform amd64
      - name: Check that the snap's runtime loads the application
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap run --shell kingfisher -c \
            'cd "$SNAP" && PYTHONDONTWRITEBYTECODE=1 python3 -s -c "import kingfisher.capture, kingfisher.screencast, kingfisher.codes, kingfisher.ocr"'
      - uses: actions/upload-artifact@v4
        with:
          name: kingfisher-snap
          path: ${{ steps.build.outputs.snap }}

  package:
    name: Build .deb
    runs-on: ubuntu-22.04
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          version="$(python3 -c 'import kingfisher; print(kingfisher.VERSION)')"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "VERSION ($version) does not match tag ($tag)"; exit 1; }
      - name: Build
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kingfisher-deb
          path: dist/*.deb
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
