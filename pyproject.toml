# Kingfisher is distributed as a .deb and a per-user installer, not on PyPI.
# This file holds tooling configuration only.

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "PL"]
ignore = [
    "E501",     # long lines are wrapped where it helps readability
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # GTK UI builders are long by nature
    "PLR2004",  # pixel and timing constants
    "PLW0603",
    "PLC0415",  # deliberate lazy imports (GDK backend selection, optional modules)
    "SIM105",
]
